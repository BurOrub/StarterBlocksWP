# Release del plugin: al push di un tag "vX.Y.Z" crea lo zip pulito (cartella starter-blocks/) e lo allega alla release.
# Il tag deve coincidere con "Version:" nel file principale del plugin. Lo zip contiene build/ già compilato (src/ e build.sh restano fuori).
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  SLUG: starter-blocks
  MAIN: starter-blocks.php

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Il tag deve coincidere con Version nel file principale
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(grep -m1 -E '^[[:space:]]*\*?[[:space:]]*Version:' "$MAIN" | sed -E 's/.*Version:[[:space:]]*//' | tr -d '\r')"
          if [ "$tag" != "$ver" ]; then
            echo "Il tag $GITHUB_REF_NAME non coincide con Version: $ver in $MAIN"
            exit 1
          fi

      - name: Il file compilato deve esistere
        run: test -s build/index.js && test -s build/meta.js

      - name: Crea lo zip pulito
        run: |
          mkdir -p "dist-zip/$SLUG"
          rsync -a \
            --exclude='.git/' --exclude='.github/' --exclude='.gitignore' --exclude='README.md' --exclude='.DS_Store' \
            --exclude='src/' --exclude='build.sh' --exclude='dist-zip/' --exclude='*.bak*' --exclude='*.orig' --exclude='*.map' --exclude='*.log' \
            ./ "dist-zip/$SLUG/"
          (cd dist-zip && zip -qr "$SLUG.zip" "$SLUG")

      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist-zip/$SLUG.zip" --title "Starter Blocks ${GITHUB_REF_NAME#v}" --generate-notes
